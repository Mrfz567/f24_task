name: f24-filesystem

x-backend-environment: &backend-environment
  APP_NAME: F24 File System
  APP_ENV: local
  APP_KEY: ${APP_KEY:-base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:5173
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: database
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-f24_filesystem}
  DB_USERNAME: ${DB_USERNAME:-f24}
  DB_PASSWORD: ${DB_PASSWORD:-f24_local_password}
  SESSION_DRIVER: array
  CACHE_STORE: database
  QUEUE_CONNECTION: database

services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-f24_filesystem}
      POSTGRES_USER: ${DB_USERNAME:-f24}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-f24_local_password}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  test-database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: f24_filesystem_test
      POSTGRES_USER: f24
      POSTGRES_PASSWORD: f24_test_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql

  backend-init:
    build:
      context: ./backend
    command:
      - sh
      - -c
      - composer install --no-interaction --prefer-dist && php artisan migrate --seed --force
    environment: *backend-environment
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor
    restart: "no"

  api:
    build:
      context: ./backend
    command:
      - php
      - -S
      - 0.0.0.0:8000
      - -t
      - public
      - public/index.php
    environment: *backend-environment
    depends_on:
      backend-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=-
        - http://127.0.0.1:8000/api/v1/health
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  worker:
    build:
      context: ./backend
    command:
      - php
      - artisan
      - queue:work
      - --sleep=1
      - --tries=3
      - --timeout=30
    environment: *backend-environment
    depends_on:
      backend-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_vendor:/app/vendor

  frontend:
    build:
      context: ./frontend
    command:
      - sh
      - -c
      - npm ci && npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_vendor:
  frontend_node_modules:
  postgres_data:
